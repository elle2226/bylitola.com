/* Layout: dark editorial. A project reel opens the page over her own glow background; case studies are long reads with a sticky chapter rail and her real figures. */

var P=[
{id:"cared4",t:"Cared4",c:"Health tech",
 hero:"kCg2ubdiBDbxHoW4Ok9ScaPR65s",bg:"#588083",cover:1,
 d:"A feedback tool that gives children and young people in NHS inpatient wards a way to share their experiences.",
 line:"A feedback tool for children and young people in NHS inpatient wards",
 tags:["NHS","Workshops","UX research","UI"],type:"Feedback tool, piloted across 12 wards",role:"UX Researcher, UX Designer, UI Designer",
 meta:"Cared4 case study: a feedback tool for children and young people in NHS inpatient wards, designed through research, workshops and a 12-ward pilot.",
 g:["Children and young people (CYP) in inpatient units felt unsupported and unheard, and needed senior staff to help improve their ward experience.","I researched existing inpatient wards, ran 4 stakeholder workshops, and held fortnightly workshops with paid CYP volunteers over 6 months. The pilot then ran for 2 months.","Highly regarded by commissioners, parents, the client and CYP. A further phase is planned."],
 ch:[
 ["Discover","Understanding the problem",[
  ["h3","Background"],
  ["p","An NHS trust was commissioned to work with our design agency to create a feedback tool. Children and young people (CYP) would use it to share their feedback, and commissioners would be able to see their responses. It would be piloted on 12 wards across England and overseen by senior and regional commissioners, who would use a heatmap to spot areas of concern."],
    ["h3","The problem"],
  ["quote","CYP in inpatient units experience a lack of support, feel unheard, and need more support from senior staff to improve their experience on the ward."],
  ["h3","Hypothesis"],
  ["p","A feedback tool built for a wide range of CYP, including those with special needs, would help them feel cared for and heard. CYP would scan a QR code on a poster to reach the platform, and could use it freely if they wished."],
  ["p","Commissioners would also have their own platform, where they could sign in to view the feedback CYP gave online."]]],
 ["Define","Listening before designing",[
  ["h3","Process overview"],
  ["p","I started by researching existing CYP inpatient wards and their experiences. I then facilitated 4 workshops with admins, clinicians, NHS regional commissioners and parents, to understand each group’s pain points and how the needs of CYP could be met alongside them."],
  ["p","I worked with another CYP group to recruit paid volunteers, and facilitated workshops with them every fortnight for 6 months to understand their needs and pain points."],
  ["gal",[["4Rxe0Fu6LCwDn5TVqgJLzFcJ4o","Fig 1. A poster I designed to recruit the CYP help group","tall"],["Pn4P6FUqkVXoqr0ALZZvFStOiE","Fig 2. Workshop boards with clinicians, NHS commissioners and parents, facilitated by me"],["aarrhhyShgRSL3XPjfldUUjZpFY","Fig 3. Workshop boards with CYP, facilitated by me every fortnight","span"]]],
  ["h3","Insights from the workshops"],
  ["h4","CYP"],["ul",["It needs to be accessible to different users","Different languages should be available","The language needs to be simple and easy to read","CYP should be able to access it at any time","The tool should not be anonymous"]],
  ["h4","Clinicians and commissioners"],["ul",["Responses should not include free text, to safeguard CYP","Multiple choice is the best alternative","We need to think about the feedback loop between CYP and commissioners","It should be online only, so answers stay confidential and can’t be read by others, which could bias genuine responses","Only one CYP should be able to use it at a time, and answers should save automatically","The tool should be anonymous","Questions need to be simple and address themes such as safety, autonomy and support"]],
  ["h4","Parents"],["ul",["The safeguarding of CYP must be ensured","Parents would also like to give feedback, which could help commissioners spot trends and similarities across responses"]],
  ["h3","Where the groups disagreed"],
  ["p","Not every insight pointed the same way. CYP wanted the tool not to be anonymous, while clinicians and commissioners wanted it anonymous. In the end, confidentiality had to come first, so the tool was designed to be anonymous."]]],
 ["Ideate","From insight to flow",[
  ["fig","ZPp2dzShaFEQAfp3O1RwD4v3uh0","Workshop insights board","tall"],
  ["gal",[["Oyr5htKE5bA3PlXsSbCzFwW0","Fig 4. User flow example of the CYP platform","span"],["oGD5w8jtFt9dn8HC23p36ap8vo","Fig 5. Analysing the insights from the workshops"],["3rN1JOGhEJyxO2yU4HdBYL7PYE","Fig 6. Analysing the insights from the workshops"]]]]],
 ["Deliver","The solution",[
  ["p","Below are the final designs for the CYP and commissioner platforms, which were used in a 2-month pilot."],
  ["p","Once the designs were done, the client asked for some changes to the designs and questions, based on feedback they received from parents. Commissioners were also given brochures to guide them on how to use the data."],
  ["gal",[["kCg2ubdiBDbxHoW4Ok9ScaPR65s","Fig 7. CYP final designs in mobile, showing the themes, questions and avatar personalisation features","span"],["83deY3S4btP2Jlv6uJAlqfn0","Fig 8. CYP final designs in tablet form, showing the menu options"],["fYh75SwQO63ZAMMo875tHiHreaM","Fig 9. Example of the questions CYP would be able to answer within the feedback tool"],["sZ8Fub6eF9xqMgBo1VRYOPOe6k","Fig 10. Commissioner’s platform showing the heatmap of England and the rating average of each region provided by CYP and parents","span"],["OGIpx9llvc3EI35wUpEabshS74","Fig 11. Commissioner’s platform showing dates that commissioners could select to see data between"],["Jf1RptLIJMdQltvbSpGo5GGFVLE","Fig 12. Commissioner’s platform showing the table view of the heatmap and the demographic questions answered by CYP and parents"],["hKGm2bTDFqTmxVOkbQC7C2jDc3Y","Fig 13. Style guide for Cared4","tall"]]]]],
 ["Iterate","Outcome and reflections",[
  ["h3","Outcome"],
  ["p","Once design was complete, we ran the pilot and gathered further feedback on both platforms."],
  ["h4","What worked"],
  ["ul",["The tool was easy to use for both commissioners and CYP. CYP enjoyed features such as the theme modes, personalised avatars and colours, and being able to add sounds.","Commissioners found it simple to log in and see the feedback that CYP and parents gave. Senior commissioners could view all wards, while regional commissioners could view one or a few."]],
  ["h4","What to improve"],
  ["ul",["In some wards, the posters CYP scanned to access the platform weren’t placed in the best spots.","Some posters also arrived late, which delayed feedback and frustrated the clinical staff who had to distribute them.","The feedback loop was a problem for commissioners, who were unsure what to do if they saw worrying stats. We agreed that user testing with commissioners would need more budget in the next phase."]],
  ["h3","Conclusion"],
  ["p","Overall, this project was a great success and highly regarded by commissioners, parents, the client and CYP. We received lots of positive feedback after presenting the designs to stakeholders across the NHS, and the project is looking to have another phase to develop the existing features."],
  ["h3","Reflections and key learnings"],
  ["p","This was one of my favourite projects, because I got to work with a large group of people and turn their findings into design solutions. With so many different voices, I sometimes felt torn about who to listen to and what to prioritise. I like to zoom out and focus on the bigger picture, which helped me work out which features and insights were high priority and would make the tool reusable, and which were nice to have but not necessary within the budget."]]]
 ]},

{id:"uk-pensions-group",t:"UK Pensions Group",c:"Finance",
 hero:"uynAsOc02goKF9jRKqeoc2TfK0",bg:"#4c6971",
 d:"A payments journey for customers looking to retire, turning fragmented journeys into a simpler, personalised path.",
 line:"A payments journey for customers looking to retire",
 tags:["Journeys","Design system","Mobile","User testing"],type:"Retirement onboarding and payments journeys",role:"Product Designer",
 meta:"UK Pensions Group case study: consolidating five fragmented retirement journeys into one simpler experience. Winner of a team-nominated award for decoding complexity and delivering excellent work well within budget.",
 g:["The existing journeys were isolated and fragmented, so users had to repeat the same steps to reach where they wanted to go.","Competitor research, stakeholder workshops to map and connect five journeys, and iterating on the portfolio page after user testing.","My team nominated me for an award, which I won, for decoding complexity and delivering excellent work well within budget."],
 ch:[
 ["Discover","Fragmented journeys",[
  ["h3","Background"],
  ["p","I had previously designed the onboarding journey for customers starting their retirement. The client then asked us to expand the Digital Retirement experience with new user journeys, more flexible content and more personalised retirement pathways."],
  ["p","These journeys were isolated and fragmented, so users had to repeat the same steps to reach where they wanted to go. For this phase, it was key to bring them together in a clean, seamless way."],
  ["h3","Hypothesis"],
  ["p","Simplifying the journey structure, clarifying decision pathways and consolidating the educational content would improve the experience and completion rates in retirement onboarding."],
  ["h3","Research"],
  ["p","I researched competitors to see how other brands consolidate multiple journeys. Our journey would involve many steps, so it was key to turn complex, fragmented journeys into a simpler one that users could navigate easily."],
  ["fig","fQKFcvGzFm0Yyb0zcbQh7y30Tw","Fig 1. Competitor research of methods to show a large number of steps in a journey"]]],
 ["Define","Mapping five journeys",[
  ["p","With the research done, I started to define the areas of focus and how the user journeys would be configured."],
  ["h3","Workshops and conversations with stakeholders"],
  ["p","After a series of workshops with the client, I mapped the key user journeys, worked out how they connected, and explored ways to streamline and unify them."],
  ["p","A core challenge was designing for flexibility. Several screens needed to appear in more than one journey, and the user’s choices decided where they went next. Users could also enter from different starting points, so the journeys weren’t linear. Many screens were reused, but their progress indicators and step trackers had to adapt to where the user was in the journey."],
  ["h3","Key challenges"],
  ["ul",["Increasing conversion, particularly on mobile","Making sure the portfolios could show higher and lower risks visually","Reusing existing screens for the new flow rather than designing new ones","Reducing drop-off, so more users sign up to request a call for advice"]],
  ["p","Waterfront is the existing programme and would still be part of the new journey. The new journeys were:"],
  ["ul",["Retirement Income Advice (RIA), an advised journey","Non-Advised Journey (NAD), with a second part depending on whether users were ready to take action","Waterfront Saving (NAD)","Waterfront Saving Advised","Waterfront Transfer In Advised"]],
  ["fig","XthSxMb61j813MuIICrWtmSIPM","Fig 2. Miro board screenshot of some of the journeys mapped out"]]],
 ["Ideate","Testing the portfolio page",[
  ["h3","Portfolio risk designs"],
  ["p","By this stage I had defined the end-to-end flows and structured the journeys so the development team could clearly follow and build them. I then shifted focus to reusing existing screens and components where possible, and refining the portfolio page based on what we learned in user testing."],
  ["p","Feedback from the previous journey and user testing:"],
  ["quote","The portfolio page design is not bad, but it would be nice if there was a way to see the key information on the same page, rather than being taken to a separate page.","User testing"],
  ["p","The new iterations therefore use a dropdown to keep each portfolio’s key information on the same page. I also added more visual representations of each portfolio’s risk, to help users decide without feeling overwhelmed."],
  ["gal",[["0WyuckLrIBSaqcgRVeb2FMBHis","Fig 3. Two new iterations of the portfolio page","span"],["d0qOEFbbHryThxLYhPACQ9cAm8","Fig 3 (continued). Two new iterations of the portfolio page"],["WoR3OCStoy2SJC3VajYVrFzAVA","Fig 3 (continued). Two new iterations of the portfolio page"]]],
  ["h3","Journey progress differences"],
  ["p","Users often started one journey and then needed to switch to another with more or fewer steps. The concern was that someone might think they had 5 steps, for example, and then find they had 10."],
  ["p","Some journeys were also long, with more than ten steps, so we had to work out how to design and build a journey that could hold that many. We added a redirect screen so users always understood where they were."],
  ["fig","eRazSrBj0hP27mUVDqhwStqH88I","Fig 4. Wireframes highlighting journey transitions"]]],
 ["Deliver","The solution",[
  ["p","Below are key pages from the completed UI designs. They stay within the client’s design system, with a few added components such as the progress bar and numbered steps."],
  ["p","The client chose to show portfolio risk in dropdowns rather than the speedometer design, so every portfolio had equal weight with less emphasis on hierarchy. They also asked for a space to drop in an image, for one of their business requirements for the portfolio, which they could change in Content Hub."],
  ["fig","glLa3dlf1s3SsHxMY91KiPpCBY","Fig 5. UI designs, desktop and mobile"]]],
 ["Iterate","Reflections",[
  ["p","Overall, this was an exciting project. My team nominated me for an award, which I won, for decoding complexity and turning it into a simple, engaging user experience, and for delivering excellent work well within budget."],
  ["p","I enjoyed making recommendations to the client and helping to elevate the user experience. It took me a little while to get my head around the user journeys at first, but once I did, I was able to demonstrate ways to improve the experience."]]]
 ]},

{id:"leanin",t:"Leanin",c:"Health tech",
 hero:"PnbJvmi94e9yOaiehCfOqJIHb8",bg:"#3a47a8",cover:1,
 d:"A web app I designed for a study exploring the relationship between NHS participants’ fitness and food intake, and how this affected their overall health.",
 line:"A web app for an NHS metabolic research study",
 tags:["Web app","NHS","Participant portal","Clinician portal"],type:"Participant and clinician web app",role:"Product Designer (UI design)",
 meta:"Leanin case study: a participant portal and clinician portal for an NHS metabolic study, designed under tight timelines.",
 g:["Stakeholders wanted a platform where clinicians and patients could run a metabolic study, including an online diary for patients to share their fitness and health data.","The project was defined before I joined, so I went straight into UI design and worked closely with engineers and project managers.","A participant portal and a clinician portal that digitalise a paper study."],
 ch:[
 ["Discover","The brief",[
  ["h3","Background"],
  ["p","An NHS trust wanted to run a research study with “Leanin”. I’ve used this name to keep the real one hidden while the project isn’t live yet."],
  ["h3","The problem"],
  ["p","The stakeholders wanted a platform for clinicians and patients to run a metabolic study. They needed an online diary for patients to share their fitness and health data, and wanted suggestions on layout and style."],
  ["h3","Hypothesis"],
  ["p","Patients would be able to update their food, drink and medical intake, link their smartwatch to the web app and fill out questionnaires. This would help clinicians see how intake and fitness level might affect overall health, and what could be contributing to body pain."],
  ["p","Clinicians would be able to see the data patients provide, create and share questionnaires, and use their own dashboard."]]],
 ["Deliver","Two portals, one study",[
  ["p","Because of time constraints, the project had been defined before I got involved, so I jumped straight into UI design."],
  ["h3","Participant portal"],
  ["p","The participant portal gave participants access to:"],
  ["ul",["A food diary, to log their food, drink and supplement intake","Tracking, to bring in their Withings and Fitbit data and link it to the portal","Questionnaires, to answer clinicians’ questions about their health and any changes they’d noticed"]],
  ["gal",[["PnbJvmi94e9yOaiehCfOqJIHb8","Fig 1. Final UI designs for patients"],["SsgAcHSNFwIFEQazGWGq3e2VZM","Fig 2. Final UI designs for patients: home page before logging in"],["zcyFAAFlNS4BgMYrjGxk1854jE","Fig 3. Final UI designs for patients: food diary to update food intake, supplements and drinks","tall"],["URLQ7yS5mmbMtGChr82Pip13yqs","Fig 4. Final UI designs for patients: Withings page to sync their data to their Fitbit"]]],
  ["h3","Clinician portal UI designs"],
  ["p","Clinicians could:"],
  ["ul",["Use their own dashboard","View participants’ food diaries","Create questionnaires for participants","See an overview of the Withings data participants collected with their smartwatches"]],
  ["gal",[["bw9WGSHLpkI3kEnL918g0TKeI","Fig 5. Final UI designs for clinicians to view their patients’ data"],["Lpt3LbhZ4tmKYtdZOyUQErz2E","Fig 6. Withings data that allows clinicians to see passive data of their patients","tall"]]]]],
 ["Iterate","Conclusion",[
  ["p","This project taught me how important it is to stay in close contact with the development team, so I knew which features were possible and which needed tweaking to become reality."],
  ["p","Going straight into UI design was a challenge, because I enjoy planning where elements can go, exploring other possible outcomes and maximising the experience for users. I’m still pleased with the outcome, and I know each client has different time constraints."],
  ["p","It was great to work with a cross-functional team and find simple ways, with engineers and project managers, to digitalise the paper study. I enjoyed the problem solving on this project, and realised I really do enjoy working in a team."]]]
 ]},

{id:"monki",t:"Monki",c:"Fashion",
 hero:"1ko8xHlHiRAsNAZDx0JwYfL9s",bg:"#4c6971",
 d:"A redesign of the PDP and PLP pages to improve accessibility and layout, while keeping the urban feel Monki is known for.",
 line:"Product pages that are more accessible and keep the urban attitude",
 tags:["PDP","PLP","Accessibility","Red route analysis"],type:"PDP and PLP redesign",role:"Product Designer",
 meta:"Monki redesign case study: competitor research, questionnaires, red route analysis and a prototype for more accessible product pages.",
 g:["Online clothing sales were growing, so the site needed to be accessible to more users and more enjoyable to use, to increase sales.","Competitor research, questionnaires, a red route analysis with 6 participants, affinity mapping, crazy 8s and wireframes, then UI and a mobile prototype.","Redesigned product detail and listing pages. Next time I would allow more time to test the final designs."],
 ch:[
 ["Discover","Background and hypothesis",[
  ["h3","Background"],
  ["p","Monki is a clothing brand founded by H&M in 2006, with both physical stores and an online shop, which gives it more opportunities to make sales. Its target audience is 16–25 year olds, and it’s designed for people who describe their dress sense as ‘urban’. Since COVID-19, online shopping has become far more popular, and it’s expected to become more desirable than shopping in store."],
  ["h3","The problem"],
  ["p","Demand for buying clothes online has grown since March 2020, pushing e-commerce sites to invest in more user-friendly features to attract a wider range of customers. Monki’s site therefore needs to be accessible to more users and offer an enjoyable experience and interface, to increase sales."],
  ["h3","Hypothesis"],
  ["p","Improving Monki’s existing features and accessibility will increase user satisfaction on the website."],
  ["h3","Competitor research"],
  ["p","I researched Monki’s direct and indirect competitors to understand how they currently meet the needs of their users and stakeholders."],
  ["gal",[["2HRBNNeTOQWAu7xZVmZ50WFc0","Fig 1. Competitor research of other direct fast fashion competitors and an indirect competitor","span"],["ubFj1PJRJA3wyn0lgr30jEw4vLQ","Fig 2. Visual notes I took whilst comparing Monki with other online stores. This enabled me to highlight features I could incorporate into the redesigns.","span"]]]]],
 ["Define","Starting with the users",[
  ["p","I wanted to start with the users and empathise with them, to understand their current problems and improve their experience."],
  ["h3","Questionnaires"],
  ["p","I asked a group of users a range of questions to find out what they like and dislike about the Monki website."],
  ["gal",[["Wh34AICxolT9MUOeSW4YBwgnhY","","span"],["tuwLdmDyLWbLm6cviY6wKlg7FA","","span"],["c9n8zbKrvYVsIrQNixYT9q5TTo","Fig 3. Overview of research surveys about Monki","span"]]],
  ["h3","Red route analysis"],
  ["p","I ran a red route analysis to find out which features users found most and least important. Most users were familiar with how online shops work, so I chose to ask about features specific to Monki. It’s easy to assume the same features matter equally across all e-commerce sites, but some can stand out more because of the interface or experience."],
  ["p","I asked 6 participants to rate how important each feature was to their shopping experience on Monki, from 1 (least important) to 5 (most important):"],
  ["ul",["Filtering prices","Clothing filter","Menu","Videos of clothing / carousel","Other payment options"]],
  ["fig","ehl2yZ7RVK5ONnUYBfnMoUhuBnQ","Fig 4. Red route analysis"],
  ["h3","Summarising my findings"],
  ["p","I used affinity mapping to summarise my findings and identify the main pain points, which guided where I started with the designs."],
  ["fig","b2S5H94K8TfpZ3yQRRM0szISjs","Fig 5. Affinity mapping of findings"]]],
 ["Ideate","Mindmaps to wireframes",[
  ["p","At this stage I brainstormed potential design solutions through mindmaps and wireframes."],
  ["gal",[["P7NHk5FEp16DzxIWTMboKDoUCEk","Fig 6. Mindmapping during ideation"],["PAxyoxullbbF85nE0Ik6jNZSRbM","Fig 7. Wireframes using the Crazy 8s method"],["6t1kqrZgxsmtDXAQ1LlwWBCVy7Y","Fig 8. Further wireframe planning","tall"],["k90I8xLmqAbNtzSSzr4OTdsTE","Fig 9. Mid-fidelity wireframe planning"]]]]],
 ["Deliver","UI designs and prototype",[
  ["h3","UI designs"],
  ["p","Below are the completed Product Detail Pages (PDP) and Product Listing Pages (PLP), along with a video of the designs."],
  ["gal",[["4DP9Y6pxZWPT3vtWO6UtPS8l0P8","Fig 10. UI designs, mobile"],["m3Mc0Hdg0PIv30HDmAqA1z68W4","Fig 11. UI designs, desktop"]]],
  ["vimeo","https://vimeo.com/585492768","Fig 12. UI designs prototype (mobile)"],
  ["fig","Pi2B6iUCtVSKiNvaxgAcQ0WL3Y","Fig 13. Business and user needs being met"],
  ["h3","Pain points revisited"],
  ["p","Below, I’ve highlighted the pain points in the original design and the changes I made."],
  ["fig","lc1Yp54b5z4ALuqaY9kd702KM","Fig 14. Pain points and the solutions"],
  ["fig","5XfvWbARn6yVI8Yc4is70kdu9dU.svg","Fig 15. Style guide","svg"]]],
 ["Iterate","Reflections",[
  ["p","Overall, this was an exciting project. I enjoyed improving Monki’s website while looking at competitors and seeing how Monki could be better. Next time, I’d like more time to test the final designs, to check that the solutions live up to what users expected."]]]
 ]},

{id:"liontrust",t:"Liontrust",c:"Finance",
 hero:"QglYhnZiYR0BqAWg0IrAKkCtPmA",bg:"#4c6971",
 d:"A reskin and information architecture update of a financial asset management website.",
 line:"A reskin and a clearer information architecture",
 tags:["Reskin","Information architecture","Accessibility","Design system"],type:"Reskin and information architecture update",role:"Product Designer",
 meta:"Liontrust case study: a heuristic review, journey mapping and a reskin that simplified information architecture for a UK asset management group.",
 g:["The website felt outdated against competitors, with unclear information architecture and disjointed journeys that hindered users from reaching their goals.","A heuristic review based on Nielsen Norman Group principles, journey mapping in Miro, and a reskin that reused and extended existing components.","Early client feedback was highly positive. A customer said the designs feel more premium and intuitive."],
 ch:[
 ["Discover","Problem and hypothesis",[
  ["live","https://www.liontrust.com/","View the live site"],
  ["h3","Background"],
  ["p","Liontrust is a well-established UK asset management group that helps personal and professional investors grow their wealth. It offers a diverse range of funds and also works in partnership with a smaller independent fund."],
  ["p","This meant the reskin and design updates had to account for the impact on that affiliated fund, keeping things consistent while respecting its own identity. Where possible we used the same components for efficiency, adding new ones only when necessary."],
  ["h3","The problem"],
  ["quote","The current website feels outdated next to its competitors. Its information architecture is unclear and its user journeys are disjointed, which makes navigation unintuitive and stops users from reaching their goals."],
  ["h3","Hypothesis"],
  ["p","Modernising the visual design, and simplifying the information architecture and user journeys, will make the site easier to use, so people can navigate more intuitively and reach their goals more efficiently."],
  ["h3","Competitor research"],
  ["p","I researched competitors to see how similar organisations meet user needs and expectations in the market. Key activities:"],
  ["ul",["Ran a heuristic review of the client’s website and key competitors, based on Nielsen Norman Group usability principles","Mapped key user journeys in Miro to find friction points and opportunities","Turned the findings into actionable recommendations to guide the reskin and wider UX improvements"]],
  ["fig","XcI9HFs4T6TiDeaSWWgHnMdkmtk","Fig 1. Competitor research and user journey analysis"],
  ["h3","Identified experience gaps"],
  ["h4","Insights Hub navigation"],
  ["ul",["Navigation behaves inconsistently across the hub, which makes it less predictable","The navigation isn’t sticky, which increases effort and disorientation","Navigation states keep changing, so users struggle to retrace their steps"]],
  ["h4","Insight cards"],
  ["ul",["Some card designs fail WCAG AA contrast standards","Quick fixes, such as darker backgrounds and heavier fonts, don’t scale","There’s no systematic approach to accessibility across components"]],
  ["h4","Fund lister"],
  ["ul",["Filters and search take up the above-the-fold space, limiting how much content is visible","The CTA hierarchy is unclear and misses engagement opportunities","“All factsheets & literature” doesn’t clearly signal that it opens an overlay","Overlay content is dense and needs a lot of scrolling","Progressive disclosure, such as accordions, could improve the structure"]],
  ["gal",[["SEES3V3hrPN2XMG60MrGXees","Fig 2. CRO analysis of an anchor page (Insights Hub)","span"],["qEutqNcHCNdwecqbGrJmRywq138","Fig 3. Insight cards would sometimes fail readability depending on the background image"],["0C7kErJZRy0RRKPeXCC2aVjCM","Fig 4. Existing fund lister pages could be maximised with the information architecture and layout"],["sRSD3y7gbRL9Z6wGPJQKYqoE","Fig 5. Existing articles lack depth and the layout is misaligned. They could promote more opportunities to continue the journey or prompt users to sign up to receive insights","tall"]]],
  ["h3","Key findings"],
  ["p","The research started to surface key usability challenges and areas where the experience wasn’t meeting user expectations."],
  ["ul",["User journeys were often long and inefficient, creating unnecessary friction","Key information wasn’t always easy to find","On-page navigation became more inconsistent as users moved through the site, making it harder to stay oriented","Content lacked clarity and structure, so there was room to streamline it and improve signposting to increase conversion and improve the experience"]]]],
 ["Define","Turning findings into questions",[
  ["p","Once the research was done, the direction for improving the website and testing the hypothesis became clearer. Below are the key problems my team and I hoped to solve."],
  ["fig","oUwCnNjGSDUJQze0shdI8JvMJk","Fig 6. How Might We statements and hypotheses","tall"]]],
 ["Ideate","Information architecture ideas",[
  ["p","The information architecture clearly needed work. Some of the key ideas we decided to adopt were:"],
  ["ul",["Adding a sidebar for a more seamless experience","Using overlays where they make sense, to shorten user journeys","Making better use of conversion CTAs, such as “Follow fund”, to prompt sign-ups"]],
  ["gal",[["H9xyKgeIMiXXaVtg2UiPb4KA","Fig 7. Insights Overview UX updates"],["zVaTKICNu00wA8QWFWO9nr4N6SA","Fig 8. Our Funds section UX updates"],["uhbpQD0HE7UeWe9ob8QGdQzVRHs","Fig 9. Fund Article UX designs","span"]]],
  ["h3","Design system"],
  ["p","We refined the design system by updating the colour tokens to improve accessibility and support dark mode across the website. The UI mostly reused existing components, and we designed a small number of new ones and added them to the system to keep things consistent and scalable."],
  ["gal",[["y17L2v61AuTRHvzuon1IGH8ct8","Fig 10. Design system updates"],["kuA69dNtgtT9e2yZqXOGxcWk7Y","Fig 11. Design system updates"]]]]],
 ["Deliver","UI designs and outcomes",[
  ["h3","UI designs"],
  ["p","Below are the completed designs, covering in particular:"],
  ["ul",["The funds lister","The insights hub","The article page"]],
  ["gal",[["cfCkRnrSHbuaebjz7GNvrfcy0","Fig 12. UI designs, Insights detail page","span"],["vAx5juMs1dD5dvR8GlYzWRr4yuI","Fig 13. UI designs, Insights overview","span"]]],
  ["quote","These new designs feel a lot more premium and intuitive. It has allowed me to get to fund information quickly and I am clear on where I need to go.","Customer quote"],
  ["h3","Aligning business and user needs"],
  ["p","The research showed we needed to improve the experience to support both the business’s expectations and users’ needs."],
  ["h4","Business outcomes"],
  ["ul",["More conversion opportunities through clearer signposting and targeted CTAs, for example a “Follow fund” action in the fund lister","Efficient design evolution by reskinning and extending existing components, reducing the need for brand-new patterns","A more refined, premium UI that lives up to the expectations of a high-value audience"]],
  ["h4","User outcomes"],
  ["ul",["Less friction in navigation, thanks to simpler journeys and persistent elements such as a sticky sidebar","Clearer, more intuitive CTAs and visual cues, such as icons that indicate overlays and actions","More flexibility in how people consume content, with features like text-to-speech for on-the-go use","Smoother interactions, with overlays showing information in context and cutting unnecessary page changes"]]]],
 ["Iterate","Reflections",[
  ["p","This project was a valuable challenge that called for careful problem-solving and a pragmatic approach. Finding ways to reuse and extend existing components, especially rethinking the role of the sidebar in different contexts, gave us a more scalable, cohesive solution. It also brought me closer to engineering and made for a more joined-up team."],
  ["p","The project is still in progress and nearing launch, and early client feedback has been very positive. They especially valued the strategic approach, including how the information architecture could scale across a smaller, related fund site that we also look after."],
  ["p","I’m looking forward to seeing the final designs built and to evaluating their impact after launch."]]]
 ]},

{id:"uk-home-developer",t:"UK Home Developer",c:"Real estate",
 hero:"VsYLPuIOtdW9BE0Bw6R02UphhRA",bg:"#ffffff",cover:1,
 d:"A website redesign and app for a premium home developer, focused on home customisation.",
 line:"A premium home customisation journey for web and mobile",
 tags:["Website redesign","App design","Design system","Prototype"],type:"Home customisation: website and logged-in experience",role:"UX and UI lead",
 meta:"UK Home Developer case study: one scalable options and choices journey for premium new-build homes, from customer interviews to a tokenised design system and prototype.",
 g:["The digital experience didn’t match the premium showhomes. Customers relied on PDFs, and it wasn’t clear which selections were confirmed and which were still outstanding.","Customer interviews, competitor analysis, product catalogue analysis, and one unified journey supporting both Styles and Schemes.","A simple, consistent experience for a complex feature, with a mobile-first journey."],
 ch:[
 ["Discover","Closing the gap with the showhome",[
  ["h3","Background"],
  ["p","A residential property developer asked us to redesign both their website and their logged-in experience. The client has been anonymised because the project hasn’t launched yet."],
  ["p","Their main challenge was a disconnect between channels. Their showhomes and sales suites delivered a high-end, premium experience, but their digital presence didn’t match that quality or sophistication."],
  ["h3","User research"],
  ["p","I interviewed several existing customers to understand their problems and how a redesigned website could solve them. I also analysed direct competitors to find gaps in the client’s website and rate its performance against the industry standard."],
  ["h3","Key focus"],
  ["p","I focused on elevating the home customisation experience across the website, and on a carefully considered mobile-first journey. The mobile designs mattered especially, as they became an appealing, interactive part of the mobile app experience."],
  ["gal",[["tFI7oDNY9eqi4F4dUpGYlvn5H5g","Fig 1. The client’s heuristic score amongst others"],["ya69aCuoUPNx8ljGWB5Cuq9QFQI","Fig 2. Customer interviews I led to understand user pain points with the existing logged-in experience"]]],
  ["h3","Research findings"],
  ["p","Once the research was done, I identified several key pain points for this project to address, including:"],
  ["ul",["An uninspiring home customisation experience for customers buying premium homes","Heavy reliance on PDFs instead of an engaging, interactive experience","No clarity on which selections were confirmed and which were still outstanding"]]]],
 ["Define","One journey, two purchasing models",[
  ["p","After the initial research, I focused on defining the key problems and finding opportunities to improve the logged-in experience."],
  ["p","The goal was a premium digital experience that felt exclusive, welcoming and personal for returning customers. The existing journey lacked clarity and didn’t reflect the high-quality experience customers received in person, so it needed a more thoughtful, refined approach that matched the brand’s luxury positioning."],
  ["h3","Requirements overview"],
  ["p","The project focused on redesigning the product selection journey for new-build homes as a single, scalable experience supporting two purchasing models:"],
  ["ul",["Styles: a predefined design style applied across the whole home","Schemes: individual product selections made for specific rooms and features"]],
  ["p","The existing experience treated these as separate journeys, which meant inconsistent navigation, more maintenance and a fragmented experience. The aim was a unified flow that worked for both models and stayed intuitive however complex a property’s available choices were."],
  ["gal",[["cMOv37RJIxPwN41LP8BGV5rdNBo","Fig 3. The customer lifecycle, completed in collaboration with our team and the client","span"],["Wq7Iq33banHUetbWwzsDXY9phw","Fig 4. Affinity map and customer journeys with user pain points and emotions across the key journey in the lifecycle","span"],["pva4uLemSWRjryfplBgdBky1o","Fig 5. Existing logged-in portal"],["gr3PR39H47kIcVaDA1V2wJXzRw","Fig 6. Existing options and choices as PDFs"]]],
  ["h3","Understanding the complexity"],
  ["p","Before designing, I analysed the product catalogue to understand how customers would interact with the available options. The data varied significantly across developments:"],
  ["ul",["About one-third of properties had configurable choices","Some developments offered only a property-wide style, others only room-level schemes, and some offered both","The largest configurations had more than a dozen product categories, with up to eighteen selectable options"]],
  ["quote","Designing around an “average” property would fail. The interface needed to be driven by the data structure itself and stay usable at any scale."],
  ["h3","Unified journey"],
  ["p","Schemes and Styles both start in the same journey and share the same navigation patterns, so users don’t have to learn two different interfaces depending on the type of property they’re buying. Rather than designing separate experiences, I was asked to establish a single interaction model that could adapt to both selection types."]]],
 ["Ideate","UX designs",[
  ["p","With a clearer direction on the issues, my team and I moved into design. We used a design system that would also work for the UI designs, by making sure every element was tokenised."],
  ["h3","Styles"],
  ["p","In this data model, a home is a pre-designed collection of colours, styles and themes that is applied to the entire home."],
  ["gal",[["GBcBDjYz2xPUi8OA5QKc65exZVg","Fig 7. Styles options and choices wireframes"],["ewG62F7MqbukKBHRjTGDBWCxQ","Fig 8. Styles options and choices wireframes"],["kQkstBvUtNxh0r3xUPGuJv68ws","Fig 9. Styles options and choices wireframes","span"]]],
  ["h3","Schemes"],
  ["p","This structure lets users choose from a selection of options, with multiple hotspots they can view and edit to suit their preferences."],
  ["p","One challenge was that hotspots didn’t always have many items to choose from, but we had to cater for up to 7 of them. The average user might only see 3 hotspots with items to choose from, while others could have up to 7, so the designs had to cope with that on desktop and mobile."],
  ["fig","SO2RVqDGOJTswpNRF60oJJlVk","Fig 10. Schemes options and choices wireframes"],
  ["h3","Design system"],
  ["p","We set up dedicated Figma themes for both wireframing and high-fidelity UI, which made the move from UX concepts to visual design smoother. Working across UX and UI gave me oversight of the design tokens, keeping the two stages consistent."],
  ["p","Our goal was to keep the client’s existing visual identity, with a slight lift, so we left the core colour palette largely unchanged. With stakeholder approval, we added accessible colour variants to better support contrast requirements and the evolving design system."],
  ["p","To avoid redundancy, I reused existing components wherever possible rather than creating single-use variants. Options & Choices was the main exception: its interaction patterns, and the way content was structured and pulled from Content Hub, needed a set of bespoke components, which made it the most distinctive addition to the design system."],
  ["fig","hLb8jAjy871t2Wvc8PYCkfmgmU","Fig 11. Variables set up in the design system"]]],
 ["Deliver","UI designs and prototype",[
  ["h3","Styles"],
  ["p","During the design phase, the client told us each home would have either Styles or Schemes, not a mix of both. I had already designed the UX for Styles to separate every room, in case some rooms used Schemes. That simplified the design and let us keep the two distinct while sharing mostly the same functionality. The flow works like this:"],
  ["ul",["The customer starts by selecting “Get started” on the Options & Choices overview","They browse the available property styles and pick one to explore room by room","In each room, hotspots can be switched on or off. On desktop, hotspot numbers and labels appear together. On mobile, numbered hotspots appear on the image, with matching labels listed below","They move freely between rooms using the persistent room navigation","They save the style for the property once they’re happy with it","If they try to leave without saving, a confirmation modal prompts them to save or exit","Once saved, a style can be viewed again at any time, discarded (with a toast notification confirming it), or confirmed as the final selection","Confirming a style is permanent and removes all the other style options"]],
  ["h4","Summary and confirmation"],
  ["ul",["All selections appear on a summary page, grouped into completed and incomplete choices","Customers can edit or discard selections (with a toast confirmation), or jump straight to the first incomplete room with the “Make choices” action","A dismissible sticky reminder banner appears when the selection deadline is within 14 days","Selecting “Confirm choices” opens a final confirmation modal","Once confirmed, selections are locked and can’t be edited"]],
  ["gal",[["qXwZPTjUCkp7iF7KxBiENY4cPN8","Fig 12. Options and choices UI designs"],["1TgjyuhMQHnnHCwSFNgHM0BN4","Fig 13. Options and choices UI designs"]]],
  ["h3","Schemes"],
  ["ul",["The customer starts by selecting “Make choices” on the Options & Choices overview. This entry screen only shows on the first visit; once any selection has been made, customers go straight to the summary page","They can move freely between rooms, or follow the “Next” CTA for a guided, step-by-step journey","Each room shows numbered interactive hotspots for the configurable items","Selecting a hotspot opens a side panel with the available product options, with a default option pre-selected and highlighted","Product choices sit in accordion panels. Selecting a new hotspot expands its accordion and collapses previously opened ones, to keep focus","Hotspots show progress clearly: a tick means the selection is confirmed, red means the default option is unchanged, and grey means nothing has been selected","Customers can undo a selection by deselecting its hotspot","Selecting “Save & exit” opens a confirmation modal to prevent accidental loss of progress. After saving, a confirmation message appears before the customer returns to the summary page"]],
  ["h4","Summary and confirmation"],
  ["p","The summary works the same way as in Styles: selections are grouped into completed and incomplete choices, can be edited or discarded with a toast confirmation, and are locked once confirmed. A dismissible sticky banner appears when the selection deadline is within 14 days."],
  ["gal",[["nDSmDNWHKKECPYmAWKyBclMUfxE","Fig 14. Options and choices UI designs"],["U3WAZjkbeRsI6j7MxrYpRULTc68","Fig 15. Options and choices UI designs"]]],
  ["video","Fig 16. Schemes options and choices prototype"],
  ["fig","jS5JGQ6s1BMRcMl7a4r91rUetM","Existing challenges and the new experience"]]],
 ["Iterate","Conclusion",[
  ["p","This project gave me the chance to lead the UX and UI for a complex feature and create a simple, consistent experience for customers. The original idea included changing the property’s colours and finishes in real time as customers made selections, but that was outside the project budget. Instead, we focused on an intuitive journey that made it easy to explore options, make choices and feel confident before confirming them."],
  ["p","This feature was both challenging and rewarding. Designing the UX first let me solve the core user problems before bringing everything together in the final UI. I especially enjoyed designing the mobile experience and creating a journey that felt clear, premium and easy to use across devices. The project reinforced how important it is to balance user needs, business goals and technical constraints to deliver the best possible experience."]]]
 ]}

'<section id="work"><div class="sec-h"><h2 class="rv">Selected work</h2><span class="mono">'+P.length+' case studies</span></div><div class="work">'+P.map(card).join("")+'</div></section>'+
